name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements.txt
      - name: lint
        run: ruff check .
      - name: type check
        run: mypy tinylm scripts
      - name: test
        run: pytest -q --cov=tinylm --cov-report=term-missing
